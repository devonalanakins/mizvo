name: Temporary sealed-backup formatter evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx prettier --write scripts/sealed-backup.ts tests/sealed-backup.test.ts
      - run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const path of ["scripts/sealed-backup.ts", "tests/sealed-backup.test.ts"]) {
              console.log("MIZVO_START:" + path);
              process.stdout.write(fs.readFileSync(path, "utf8"));
              console.log("MIZVO_END:" + path);
            }
          '
