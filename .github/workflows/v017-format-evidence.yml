name: Temporary V0.17 formatter evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx prettier --write tests/platform.test.ts
      - run: |
          echo "MIZVO_FORMAT_START"
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync("tests/platform.test.ts","utf8");const a=s.indexOf("test(\"V0.17 delegated tasks");const b=s.indexOf("test(\"V0.15 review migration");if(a<0||b<a)process.exit(1);process.stdout.write(s.slice(a,b));'
          echo "MIZVO_FORMAT_END"
