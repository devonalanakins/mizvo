name: Temporary V0.20 formatting evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx prettier --write packages/ui/theme.css tests/browser.mjs tests/platform.test.ts
      - run: |
          node --input-type=module -e '
            import fs from "node:fs";
            function emit(name, value) {
              console.log("MIZVO_START:" + name);
              process.stdout.write(value);
              if (!value.endsWith("\n")) process.stdout.write("\n");
              console.log("MIZVO_END:" + name);
            }
            const css = fs.readFileSync("packages/ui/theme.css", "utf8");
            const ca = css.indexOf("/* One actual next action");
            const cb = css.indexOf(".decision-focus {", ca);
            if (ca < 0 || cb < 0) process.exit(1);
            emit("css", css.slice(ca, cb));
            const platform = fs.readFileSync("tests/platform.test.ts", "utf8");
            const pa = platform.indexOf("test(\"V0.20 Client Space");
            const pb = platform.indexOf("test(\"Living Brief preserves", pa);
            if (pa < 0 || pb < 0) process.exit(1);
            emit("platform", platform.slice(pa, pb));
            emit("browser", fs.readFileSync("tests/browser.mjs", "utf8"));
          '
